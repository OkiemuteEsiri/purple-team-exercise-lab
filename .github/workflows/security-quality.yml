name: security-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate exercise matrix
        run: python src/coverage_analyzer.py exercises/exercise_matrix.csv

      - name: Generate synthetic assessment
        run: python src/cli.py data/synthetic_results.json --output /tmp/purple-team-assessment.md

      - name: Validate assessment output
        run: |
          grep -q "Purple Team Validation Assessment" /tmp/purple-team-assessment.md
          grep -q "telemetry_gap" /tmp/purple-team-assessment.md
          grep -q "detection_gap" /tmp/purple-team-assessment.md
          grep -q "not proof of compromise" /tmp/purple-team-assessment.md
